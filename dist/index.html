<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/ironbear_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>IRONBEAR</title>
    <script type="module" crossorigin src="/assets/index-CsjQb_Wn.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DrRbG0ro.css">
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>

      <!-- Live HUD -->
      <div id="hud">
        <div class="hud-top">
          <div class="hud-block">
            <span class="hud-label">LIVES</span>
            <span id="lives" class="hud-lives"></span>
          </div>
          <div class="hud-block center">
            <span id="stage" class="hud-stage"></span>
          </div>
          <div class="hud-block right">
            <span class="hud-label">SCORE</span>
            <span id="score" class="hud-score">0</span>
          </div>
        </div>
        <div class="prog">
          <div id="progFill" class="prog-fill"></div>
        </div>
        <div id="hulkBar" class="hulk-bar">
          <span class="hulk-label">💪 HULK BEAR</span>
          <div class="hulk-track"><div id="hulkFill" class="hulk-fill"></div></div>
        </div>
      </div>

      <!-- Mute toggle -->
      <button id="muteBtn" class="mute-btn" title="Mute / unmute (M)">🔊</button>

      <!-- Center banner (checkpoints) -->
      <div id="banner" class="banner"></div>

      <!-- Full-screen overlay (start / gameover / victory) -->
      <div id="overlay" class="overlay">
        <div class="card">
          <img class="brand-logo" src="/brand/ironbear_logo.png" alt="IRONBEAR" />
          <h1 id="screenTitle"></h1>
          <p id="screenBody"></p>
          <button id="screenBtn"></button>
        </div>
      </div>
    </div>
  </body>
</html>
